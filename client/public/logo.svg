<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="taviGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="taviGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Aura -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#taviGrad1)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />
  <!-- Hexagonal Nexus Core -->
  <polygon points="50,16 80,33 80,67 50,84 20,67 20,33" fill="none" stroke="url(#taviGrad1)" stroke-width="3" filter="url(#glow)" />
  <!-- Internal Prism facets -->
  <path d="M50,16 L50,50 L80,67" fill="none" stroke="url(#taviGrad2)" stroke-width="2.5" opacity="0.9" />
  <path d="M50,50 L20,67" fill="none" stroke="url(#taviGrad1)" stroke-width="2.5" opacity="0.9" />
  <path d="M50,50 L80,33" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.7" />
  <path d="M50,50 L20,33" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.7" />
  <!-- Core glowing spark -->
  <circle cx="50" cy="50" r="5" fill="#38BDF8" filter="url(#glow)" />
</svg>

